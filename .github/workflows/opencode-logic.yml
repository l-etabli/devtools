name: OpenCode Engine (Zen Logic)

on:
  workflow_call:
    inputs:
      model:
        required: true
        type: string
        description: "Le modèle LLM à utiliser"
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run OpenCode
        uses: sst/opencode/github@latest
        env:
          # PLUS BESOIN des clés Google/Anthropic individuelles
          # Une seule clé pour gouverner tous les modèles via OpenCode Zen
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Tu passes toujours le modèle spécifique (ex: anthropic/claude-opus-4.5)
          # Zen se charge de router la requête vers le bon fournisseur
          model: ${{ inputs.model }}