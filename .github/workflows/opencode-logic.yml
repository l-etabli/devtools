name: OpenCode Engine

on:
  workflow_call:
    inputs:
      comment:
        required: true
        type: string
        description: "The issue comment body containing the trigger keyword"
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Parse model from comment
        id: parse
        run: |
          COMMENT="${{ inputs.comment }}"
          MODEL=""

          # Model mapping - add new models here
          if [[ "$COMMENT" == *"/oc-opus-4.5"* ]]; then
            MODEL="opencode/claude-opus-4-5"
          elif [[ "$COMMENT" == *"/oc-gemini-3-pro"* ]]; then
            MODEL="opencode/gemini-3-pro"
          elif [[ "$COMMENT" == *"/oc-gemini-3-flash"* ]]; then
            MODEL="opencode/gemini-3-flash"
          elif [[ "$COMMENT" == *"/oc-help"* ]] || [[ "$COMMENT" == *"/oc-list"* ]]; then
            gh issue comment ${{ github.event.issue.number }} --body "## 🤖 OpenCode Available Models
            | Trigger | Model | Use Case |
            | :--- | :--- | :--- |
            | \`/oc-gemini-3-flash\` | Gemini 3 Flash | Quick tasks, docs, typos |
            | \`/oc-gemini-3-pro\` | Gemini 3 Pro | Standard features, daily coding |
            | \`/oc-opus-4.5\` | Claude Opus 4.5 | Complex architecture, deep reasoning |

            Simply use one of these triggers followed by your request."
            exit 0
          fi


          if [ -z "$MODEL" ]; then
            echo "::error::No matching model found in comment. Use /oc-help to see available models."
            exit 1
          fi

          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "Selected model: $MODEL"

      - name: React to comment
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f "content=eyes"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run OpenCode
        uses: sst/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ steps.parse.outputs.model }}
