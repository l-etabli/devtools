name: OpenCode Engine

on:
  workflow_call:
    inputs:
      comment:
        required: true
        type: string
        description: "The issue comment body containing the trigger keyword"
      prompt:
        required: false
        type: string
        default: ""
        description: "Optional custom prompt to override the default behavior"
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Permissions are inherited from the calling workflow

    steps:
      - name: Acknowledge comment
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            ENDPOINT="/repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}/reactions"
          else
            ENDPOINT="/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            $ENDPOINT \
            -f "content=eyes" || echo "Failed to add reaction"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Parse model from comment
        id: parse-model
        run: |
          COMMENT="${{ inputs.comment }}"
          MODEL=""

          # Model mapping
          if [[ "$COMMENT" == *"/oc-opus-4-5"* ]]; then
            MODEL="opencode/claude-opus-4-5"
          elif [[ "$COMMENT" == *"/oc-gemini-3-pro"* ]]; then
            MODEL="opencode/gemini-3-pro"
          elif [[ "$COMMENT" == *"/oc-gemini-3-flash"* ]]; then
            MODEL="opencode/gemini-3-flash"
          fi

          if [ -z "$MODEL" ]; then
            echo "::error::No matching model found in comment."
            exit 1
          fi

          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "Selected model: $MODEL"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Triage mode with LLM
        id: triage
        run: |
          IS_PR="${{ github.event.issue.pull_request != null || github.event.pull_request != null }}"
          CONTEXT=$([[ "$IS_PR" == "true" ]] && echo "PR comment" || echo "Issue comment")
          
          PROMPT="You are a triage assistant. Respond with ONLY one word: plan, implement, or review.

          CONTEXT: ${CONTEXT}
          COMMENT: ${{ inputs.comment }}

          MODES:
          - plan: Analysis, research, or planning. Use when unclear.
          - implement: User explicitly wants code changes now.
          - review: Feedback on PR code (only for PR comments).

          Respond with ONLY one word."

          # Use GLM 4.7 (free model that works with chat/completions endpoint)
          RESPONSE=$(curl -s "https://opencode.ai/zen/v1/chat/completions" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"glm-4.7-free\", \"messages\": [{\"role\": \"user\", \"content\": $(echo "$PROMPT" | jq -Rs .)}]}")
          
          # Check for API error
          if echo "$RESPONSE" | jq -e '.type == "error"' > /dev/null 2>&1; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // "Unknown error"')
            echo "::error::Triage API error: $ERROR_MSG"
            exit 1
          fi
          
          MODE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          
          echo "Parsed MODE: $MODE"
          
          # Validate and fallback
          if [[ "$MODE" != "plan" && "$MODE" != "implement" && "$MODE" != "review" ]]; then
            echo "Invalid mode '$MODE', falling back to plan"
            MODE="plan"
          fi
          if [[ "$MODE" == "review" && "$IS_PR" != "true" ]]; then
            echo "Review mode not valid for issues, falling back to plan"
            MODE="plan"
          fi
          
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Final mode: $MODE"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Set up Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Mark related PR comments
        if: steps.triage.outputs.mode == 'review'
        run: |
          PR_NUMBER=${{ github.event.issue.number || github.event.pull_request.number }}
          AGENT_HANDLE="@l-etabli/oc-"
          
          # Mark issue/general comments
          ISSUE_COMMENTS=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments --paginate -q ".[] | select(.body | contains(\"$AGENT_HANDLE\")) | .id")
          for ID in $ISSUE_COMMENTS; do
            if [ "$ID" != "${{ github.event.comment.id }}" ] || [ "${{ github.event_name }}" != "issue_comment" ]; then
              gh api --method POST -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/issues/comments/$ID/reactions -f "content=eyes" || true
            fi
          done

          # Mark PR diff comments
          DIFF_COMMENTS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments --paginate -q ".[] | select(.body | contains(\"$AGENT_HANDLE\")) | .id")
          for ID in $DIFF_COMMENTS; do
            if [ "$ID" != "${{ github.event.comment.id }}" ] || [ "${{ github.event_name }}" != "pull_request_review_comment" ]; then
              gh api --method POST -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/pulls/comments/$ID/reactions -f "content=eyes" || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run OpenCode
        uses: sst/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ steps.parse-model.outputs.model }}
          use_github_token: true
          prompt: |
            MODE: ${{ steps.triage.outputs.mode }}
            USER REQUEST:
            ${{ inputs.comment }}

            RULES:
            - Be extremely concise. Sacrifice grammar for brevity.
            - Functional programming over classes. Pure functions, immutable data.
            - Long descriptive names over comments. Avoid comments unless explaining "why".
            - Prefer named exports over default exports.
            - TypeScript strict mode. No `any`. Unions over enums.
            - Explicit error handling, no silent failures.
            - Use pnpm, biome for linting/formatting.
            - Run `pnpm typecheck` before finishing.

            MODE BEHAVIOR:
            - plan: Research and post a detailed plan as a comment. Do NOT create branches or PRs.
            - implement: Proceed with implementation and submit a PR.
            - review: Provide feedback on PR code.

            INSTRUCTIONS:
            ${{ inputs.prompt || 'Fulfill the USER REQUEST with HIGHEST PRIORITY following the RULES and MODE BEHAVIOR above.' }}
