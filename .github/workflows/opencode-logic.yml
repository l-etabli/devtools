name: OpenCode Engine

on:
  workflow_call:
    inputs:
      comment:
        required: true
        type: string
        description: "The issue comment body containing the trigger keyword"
      agent:
        required: false
        type: string
        default: ""
        description: "The agent to use (primary or plan). If not provided, it will be determined from the comment."
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Parse model from comment
        id: parse
        run: |
          COMMENT="${{ inputs.comment }}"
          MODEL=""

          # Model mapping - add new models here
          if [[ "$COMMENT" == *"/oc-opus-4-5"* ]]; then
            MODEL="opencode/claude-opus-4-5"
          elif [[ "$COMMENT" == *"/oc-gemini-3-pro"* ]]; then
            MODEL="opencode/gemini-3-pro"
          elif [[ "$COMMENT" == *"/oc-gemini-3-flash"* ]]; then
            MODEL="opencode/gemini-3-flash"
          fi

          if [ -z "$MODEL" ]; then
            echo "::error::No matching model found in comment. Use: /oc-gemini-3-flash, /oc-gemini-3-pro, or /oc-opus-4-5"
            exit 1
          fi

          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "Selected model: $MODEL"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch central agent rules
        run: |
          gh api /repos/l-etabli/devtools/contents/AGENTS.md -q .content | base64 -d > AGENTS.md.central
          if [ -f AGENTS.md ]; then
            echo -e "\n\n# Project Specific Rules\n" >> AGENTS.md.central
            cat AGENTS.md >> AGENTS.md.central
          fi
          mv AGENTS.md.central AGENTS.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Determine Agent
        id: mode
        run: |
          if [ -n "${{ inputs.agent }}" ]; then
            echo "agent=${{ inputs.agent }}" >> $GITHUB_OUTPUT
          else
            COMMENT=$(echo "${{ inputs.comment }}" | tr '[:upper:]' '[:lower:]')
            if [[ "$COMMENT" =~ (fix|implement|add|create|refactor|go ahead|looks good|proceed|approved|/oc-go) ]]; then
              echo "agent=primary" >> $GITHUB_OUTPUT
            else
              echo "agent=plan" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run OpenCode
        uses: sst/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ steps.parse.outputs.model }}
          agent: ${{ steps.mode.outputs.agent }}
