name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  triage:
    if: contains(github.event.comment.body, '/oc-')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - id: detect
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" == *"@l-etabli/oc-implement"* ]]; then
            echo "mode=implement" >> $GITHUB_OUTPUT
          else
            echo "mode=plan" >> $GITHUB_OUTPUT
          fi

  plan:
    needs: triage
    if: needs.triage.outputs.mode == 'plan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - name: Parse model from comment
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          MODEL=""

          if [[ "$COMMENT" == *"/oc-opus-4-5"* ]]; then
            MODEL="opencode/claude-opus-4-5"
          elif [[ "$COMMENT" == *"/oc-gemini-3-pro"* ]]; then
            MODEL="opencode/gemini-3-pro"
          elif [[ "$COMMENT" == *"/oc-gemini-3-flash"* ]]; then
            MODEL="opencode/gemini-3-flash"
          fi

          if [ -z "$MODEL" ]; then
            echo "::error::No matching model found in comment. Use: /oc-gemini-3-flash, /oc-gemini-3-pro, or /oc-opus-4-5"
            exit 1
          fi

          echo "model=$MODEL" >> $GITHUB_OUTPUT
          echo "Selected model: $MODEL"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch central agent rules
        run: |
          gh api /repos/l-etabli/devtools/contents/AGENTS.md -q .content | base64 -d > AGENTS.md.central
          if [ -f AGENTS.md ]; then
            echo -e "\n\n# Project Specific Rules\n" >> AGENTS.md.central
            cat AGENTS.md >> AGENTS.md.central
          fi
          mv AGENTS.md.central AGENTS.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run OpenCode
        uses: sst/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ steps.parse.outputs.model }}
          token: ${{ github.token }}
          prompt: |
            Review this issue/comment. Analyze the codebase and provide a detailed plan.
            Do NOT create branches or PRs - only respond with a comment explaining your analysis and proposed solution.

  implement:
    needs: triage
    if: needs.triage.outputs.mode == 'implement'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: l-etabli/devtools/.github/workflows/opencode-logic.yml@main
    with:
      comment: ${{ github.event.comment.body }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
