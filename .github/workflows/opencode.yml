name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  triage:
    if: contains(github.event.comment.body, '/oc-')
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.mode.outputs.agent }}
    steps:
      - id: mode
        run: |
          COMMENT=$(echo "${{ github.event.comment.body }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$COMMENT" =~ (fix|implement|add|create|refactor|go ahead|looks good|proceed|approved|/oc-go) ]]; then
            echo "agent=primary" >> $GITHUB_OUTPUT
          else
            echo "agent=plan" >> $GITHUB_OUTPUT
          fi

  plan:
    needs: triage
    if: needs.triage.outputs.agent == 'plan'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: l-etabli/devtools/.github/workflows/opencode-logic.yml@main
    with:
      comment: ${{ github.event.comment.body }}
      prompt: |
        Review this issue/comment. Analyze the codebase and provide a detailed plan.
        Do NOT create branches or PRs - only respond with a comment explaining your analysis and proposed solution.
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  implement:
    needs: triage
    if: needs.triage.outputs.agent == 'primary'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: l-etabli/devtools/.github/workflows/opencode-logic.yml@main
    with:
      comment: ${{ github.event.comment.body }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
